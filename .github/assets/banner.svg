<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5b6af0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5b6af0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#141418" stroke-width="1"/>
    </pattern>
    <mask id="fade-grid">
      <rect width="1200" height="300" fill="url(#fadegrad)"/>
    </mask>
    <linearGradient id="fadegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" mask="url(#fade-grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- hexagon logo mark, matching the dashboard sidebar's own logo -->
  <g transform="translate(64,48)">
    <polygon points="18,2 32,10 32,26 18,34 4,26 4,10" fill="none" stroke="#ededf0" stroke-width="2"/>
    <circle cx="18" cy="18" r="4.5" fill="#5b6af0"/>
  </g>

  <text x="112" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','DM Sans',sans-serif" font-size="26" font-weight="700" letter-spacing="0.5" fill="#ededf0">CloudSecOps</text>

  <!-- live badge, top right — mirrors the sidebar's own connection indicator -->
  <g transform="translate(1020,54)">
    <circle cx="6" cy="6" r="5" fill="#1db954">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="10" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DM Mono',monospace" font-size="12" letter-spacing="1.5" fill="#7a7a8c">LIVE</text>
  </g>

  <text x="64" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','DM Sans',sans-serif" font-size="52" font-weight="800" fill="#ededf0">CloudSecOps Pipeline</text>
  <text x="64" y="196" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DM Mono',monospace" font-size="17" fill="#7a7a8c">Event-driven cloud compliance automation — collect, evaluate, prove, alert</text>

  <!-- the actual pipeline, not decoration: five real stages, connected -->
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DM Mono',monospace" font-size="12" font-weight="600" letter-spacing="0.5">

    <!-- COLLECT -->
    <rect x="64" y="230" width="160" height="42" rx="6" fill="#0d0d10" stroke="#1e1e26"/>
    <circle cx="84" cy="251" r="4" fill="#7a7a8c"/>
    <text x="98" y="255" fill="#ededf0">COLLECT</text>

    <path d="M224 251 H284" stroke="#2a2a36" stroke-width="1.5"/>
    <polygon points="284,251 276,247 276,255" fill="#2a2a36"/>

    <!-- EVALUATE — the core: OPA/Rego policy engine, highlighted -->
    <rect x="294" y="230" width="160" height="42" rx="6" fill="#5b6af0"/>
    <circle cx="314" cy="251" r="4" fill="#0a0a0d"/>
    <text x="328" y="255" fill="#0a0a0d">EVALUATE</text>

    <path d="M454 251 H514" stroke="#2a2a36" stroke-width="1.5"/>
    <polygon points="514,251 506,247 506,255" fill="#2a2a36"/>

    <!-- EVIDENCE -->
    <rect x="524" y="230" width="160" height="42" rx="6" fill="#0d0d10" stroke="#1e1e26"/>
    <circle cx="544" cy="251" r="4" fill="#1db954"/>
    <text x="558" y="255" fill="#ededf0">EVIDENCE</text>

    <path d="M684 251 H744" stroke="#2a2a36" stroke-width="1.5"/>
    <polygon points="744,251 736,247 736,255" fill="#2a2a36"/>

    <!-- BROADCAST -->
    <rect x="754" y="230" width="160" height="42" rx="6" fill="#0d0d10" stroke="#1e1e26"/>
    <circle cx="774" cy="251" r="4" fill="#5b6af0"/>
    <text x="788" y="255" fill="#ededf0">BROADCAST</text>

    <path d="M914 251 H974" stroke="#2a2a36" stroke-width="1.5"/>
    <polygon points="974,251 966,247 966,255" fill="#2a2a36"/>

    <!-- ALERT -->
    <rect x="984" y="230" width="160" height="42" rx="6" fill="#0d0d10" stroke="#1e1e26"/>
    <circle cx="1004" cy="251" r="4" fill="#e03434"/>
    <text x="1018" y="255" fill="#ededf0">ALERT</text>
  </g>
</svg>
