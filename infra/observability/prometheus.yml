# Scrape config for the local docker-compose stack (ADR-006). One job: the
# backend's own /metrics endpoint, which prometheus-fastapi-instrumentator
# exposes automatically (HTTP request rate/latency/size, all unversioned —
# see app/main.py) alongside the custom counters/gauges wired into the
# service layer (scans_triggered_total, findings_created_total,
# evidence_chain_verifications_total, security_score_current).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: cloudsecops-backend
    static_configs:
      - targets: ["backend:8000"]
