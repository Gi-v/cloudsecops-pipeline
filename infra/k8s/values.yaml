backend:
  image:
    repository: cloudsecops/backend
    # Pin a real tag at deploy time (`--set backend.image.tag=$GIT_SHA` from
    # CI) — "latest" is mutable and gives every rollout a different,
    # unauditable set of bits behind the same name.
    tag: "1.0.0"
    pullPolicy: Always
  replicaCount: 2
  port: 8000
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits: { cpu: "1000m", memory: "512Mi" }
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    COLLECTOR_MODE: simulate

frontend:
  image:
    # Built from the frontend Dockerfile's `prod` stage (nginx serving the
    # static Vite build) — not the `dev` stage docker-compose.yml uses for
    # local hot-reload. Build with:
    #   docker build --target prod -t cloudsecops/frontend:latest ./frontend
    repository: cloudsecops/frontend
    tag: "1.0.0"
    pullPolicy: Always
  replicaCount: 2
  # 8080, matching the unprivileged nginx image's non-root listen port
  # (see frontend/Dockerfile's prod stage) — the Service below still
  # exposes this externally as plain port 80.
  port: 8080
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

postgres:
  enabled: true
  storage: 10Gi
  database: cloudsecops
  user: cloudsecops

kafka:
  enabled: true
  # Production deployments should point at a managed Kafka (MSK/Confluent Cloud)
  # via externalBootstrapServers instead of running Kafka in-cluster.
  externalBootstrapServers: ""

opa:
  enabled: true
  policyConfigMap: cloudsecops-policies

minio:
  enabled: true
  storage: 20Gi

redis:
  enabled: true

ingress:
  enabled: true
  host: cloudsecops.example.com
  tls: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

# A PDB per workload so a voluntary disruption (node drain, cluster
# upgrade) can't take every replica down at once — separate from the HPA
# above, which only reacts to load, not maintenance events.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

observability:
  # Prometheus + Grafana, provisioned exactly like docker-compose.yml's
  # local stack (ADR-006) — the same scrape config and dashboard JSON,
  # mounted from ConfigMaps instead of bind mounts.
  enabled: true
  grafana:
    adminUser: admin
    # Overridden per-environment via --set or a Secret in real deployments —
    # see backend-secrets' own CHANGE_ME placeholders for the same pattern.
    adminPassword: "CHANGE_ME"
    storage: 2Gi
  prometheus:
    storage: 5Gi
