{{- if and .Values.kafka.enabled (not .Values.kafka.externalBootstrapServers) }}
# Single-broker Kafka — demo-only, same posture as docker-compose.yml's
# local stack (replication factor 1, no in-cluster HA). See zookeeper.yaml's
# comment for the production escape hatch (kafka.externalBootstrapServers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    app: cloudsecops-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudsecops-kafka
  template:
    metadata:
      labels:
        app: cloudsecops-kafka
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: "confluentinc/cp-kafka:7.9.10"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: {{ printf "%s-zookeeper:2181" .Release.Name | quote }}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ printf "PLAINTEXT://%s-kafka:9092" .Release.Name | quote }}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          readinessProbe:
            exec:
              command: ["kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: cloudsecops-kafka
  ports:
    - port: 9092
      targetPort: 9092
{{- end }}
