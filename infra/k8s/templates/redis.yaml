{{- if .Values.redis.enabled }}
# Backs the rate limiter's shared storage (app/core/rate_limit.py) so scan
# and login rate limits are consistent across every backend replica —
# without it, the app degrades gracefully to per-pod in-memory limiting
# (see that module's own docstring), so redis is a demo/plain-deployment
# convenience, not a hard dependency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: cloudsecops-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudsecops-redis
  template:
    metadata:
      labels:
        app: cloudsecops-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "redis:8-alpine"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "128Mi" }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: cloudsecops-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
