apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Overridden per-environment via `helm install --set-file` or a sealed-secrets /
  # external-secrets-operator integration in real deployments. Placeholder values
  # here only support `helm template` rendering for review.
  # checkov:skip=CKV_SECRET_4: CHANGE_ME is a literal, intentional placeholder
  # (see comment above) — not a real credential, and Checkov's secrets scanner
  # has no way to tell that string apart from one syntactically.
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:CHANGE_ME@%s-postgres:5432/%s" .Values.postgres.user .Release.Name .Values.postgres.database | quote }}
  # Also the JWT HS256 signing secret (app/core/security.py) — keep at 32+
  # characters even as a placeholder so pyjwt doesn't warn about a
  # below-recommended HMAC key length (RFC 7518 section 3.2).
  APP_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_32_CHARS_MIN"
  # Must match minio.yaml's MINIO_ROOT_USER/MINIO_ROOT_PASSWORD exactly —
  # both CHANGE_ME placeholders, overridden together in any real deployment.
  MINIO_ACCESS_KEY: "cloudsecops"
  MINIO_SECRET_KEY: "CHANGE_ME"
