apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend-config
  namespace: {{ .Release.Namespace }}
data:
  APP_ENV: {{ .Values.backend.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  COLLECTOR_MODE: {{ .Values.backend.env.COLLECTOR_MODE | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.externalBootstrapServers | default (printf "%s-kafka:9092" .Release.Name) | quote }}
  OPA_URL: {{ printf "http://%s-opa:8181" .Release.Name | quote }}
  MINIO_ENDPOINT: {{ printf "%s-minio:9000" .Release.Name | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" .Release.Name | quote }}
# The OPA policy ConfigMap ({{ .Values.opa.policyConfigMap }}, referenced by
# name in opa.yaml) is deliberately NOT declared as a resource in this
# chart. Helm owns everything it creates — a `helm upgrade` diffs this
# chart's own templates against cluster state, and an empty placeholder
# ConfigMap declared here would get reset to empty (deleting every real
# policy) on the next upgrade after `make k8s-up`/a CD pipeline seeds it via
# kubectl, since Helm has no way to know that data was intentionally added
# out of band. Kept fully external instead — created and updated by `make
# k8s-up` (see Makefile) or a CD pipeline step (infra/github-actions/ci.yml's
# deploy job), completely independent of the Helm release lifecycle. This is
# also what makes ADR-002's "OPA hot-reloads a policy update with no backend
# rollout" claim true in practice: a policy change is a plain `kubectl apply`
# to this ConfigMap, never a `helm upgrade` at all.
#
# NOT a plain `kubectl create configmap --from-file=policies/`: that only
# picks up files directly in policies/, silently dropping every file under
# policies/cis, policies/nist, policies/iso27001 — see the Makefile's
# k8s-up target for the flattening step this actually needs (every policy
# file declares `package cloudsecops` regardless of its subdirectory, so
# OPA doesn't care that the directory structure is gone).
