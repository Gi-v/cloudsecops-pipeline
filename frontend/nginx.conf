server {
    # 8080, not 80 — binding <1024 requires root, and the Helm chart runs
    # this container as a non-root user (see infra/k8s security contexts).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Safe to set blind — none change app behavior, only add protection.
    # A real Content-Security-Policy and Strict-Transport-Security are
    # deliberately left out: CSP needs tuning against every page (Vite's
    # own dev-time inline scripts, Chart.js canvas, framer-motion's inline
    # styles) to avoid silently breaking something, and this chart's
    # ingress.tls is optional (see infra/k8s/templates/ingress.yaml), so
    # nginx here can't assume TLS is actually on. Both are real follow-ups,
    # not silently skipped — see the same note on the backend's
    # SecurityHeadersMiddleware.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache hashed asset filenames aggressively; index.html never (so a new
    # deploy is picked up on next load instead of being stuck behind a
    # cached shell referencing old asset hashes).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — client-side routing (react-router) owns every path
    # that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
